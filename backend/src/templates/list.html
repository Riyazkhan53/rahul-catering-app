<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8" />

  <style>
    @font-face {
      font-family: "TamilPrint";
      src: url("/fonts/NotoSansTamil-Regular.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
    }

    body {
      font-family: Arial, sans-serif;
      font-size: 14px;
      margin: 24px;
    }

    .tamil {
      font-family: "TamilPrint", sans-serif;
      font-weight: 400;
    }

    .header {
      display: flex;
      align-items: center;
      border-bottom: 2px solid #ADC455;
      padding-bottom: 8px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 8px;
    }

    th {
      background: #f3f4f6;
    }
  </style>
</head>

<body>
  <div class="header">
    <h2>Rahul Catering & Events</h2>
  </div>

  <table id="table"></table>

  <script>
  const data = __DATA__;
  const table = document.getElementById("table");

  table.innerHTML = `
    <tr>
      <th>Items</th>
      <th>Qty</th>
    </tr>
    ${data.items.map(i => `
      <tr>
        <td>
          <span>${i.name}</span>
          ${i.tamilName ? `
            <span> / </span>
            <span class="tamil" lang="ta">${i.tamilName}</span>
          ` : ""}
        </td>
        <td>${i.quantity} ${i.unit}</td>
      </tr>
    `).join("")}
  `;
</script>
</body>
</html>
